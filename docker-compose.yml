services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: volleylog
      POSTGRES_PASSWORD: volleylog
      POSTGRES_DB: volleylog
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/src/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  server:
    build: ./server
    depends_on:
      - db
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://volleylog:volleylog@db:5432/volleylog
      SESSION_SECRET: change_me_in_production
      CLIENT_ORIGIN: http://localhost
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  db_data:
